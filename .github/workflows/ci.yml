name: Finance Manager CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine

        env:
          POSTGRES_DB: finance_manager
          POSTGRES_USER: finance_user
          POSTGRES_PASSWORD: finance_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U finance_user -d finance_manager"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/finance_manager
      DB_USERNAME: finance_user
      DB_PASSWORD: finance_password
      JWT_SECRET: dGVzdC1qd3Qtc2VjcmV0LXRlc3QtMzItYnl0ZXMtbG9uZw==
      JWT_EXPIRATION_MS: 3600000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode clean verify

      - name: Analyze with SonarQube Cloud
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn --batch-mode
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error
          retention-days: 14